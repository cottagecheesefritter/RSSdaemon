name: BleepingComputer to Discord

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (GitHub may run it a bit late)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write  # lets the workflow commit seen.json back to the repo

concurrency:
  group: rss-to-discord
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Post new articles
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 rss_to_discord.py

      - name: Save list of posted articles
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update posted articles"
            git pull --rebase
            git push
          fi
